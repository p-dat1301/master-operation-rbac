version: "3.9"

services:
  api:
    build: .
    container_name: masterop_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - ./migrations:/app/migrations
    depends_on:
      db:
        condition: service_healthy
    networks:
      - masterop_net
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    container_name: masterop_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: masterop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d masterop"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - masterop_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: masterop_redis
    ports:
      - "6379:6379"
    networks:
      - masterop_net
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  masterop_net:
    driver: bridge
